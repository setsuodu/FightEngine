name: Release Editor

on:
  push:
    tags:
      - 'v*'           # v1.0.0
      - 'editor/v*'    # editor/v1.0.0（可选前缀，兼容 monorepo 习惯）
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for manual run (e.g. 0.1.0-dev)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build + GitHub Release
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/editor/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/editor/}"
            VERSION="${TAG#v}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version || '0.0.0-dev' }}"
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}  TAG=${TAG}"

      - name: Configure (VS 2022 x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $out = "FightEngine-${ver}-win-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/bin/Release/editor.exe $out/
          Copy-Item build/bin/Release/game.dll  $out/
          # optional: pdb if present
          if (Test-Path build/bin/Release/editor.pdb) { Copy-Item build/bin/Release/editor.pdb $out/ }
          if (Test-Path build/bin/Release/game.pdb)   { Copy-Item build/bin/Release/game.pdb   $out/ }
          Compress-Archive -Path $out/* -DestinationPath "${out}.zip" -Force
          Get-ChildItem $out, "${out}.zip" | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FightEngine-${{ steps.ver.outputs.version }}-win-x64
          path: |
            FightEngine-${{ steps.ver.outputs.version }}-win-x64/
            FightEngine-${{ steps.ver.outputs.version }}-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FightEngine ${{ steps.ver.outputs.tag }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            FightEngine-${{ steps.ver.outputs.version }}-win-x64.zip
            FightEngine-${{ steps.ver.outputs.version }}-win-x64/editor.exe
            FightEngine-${{ steps.ver.outputs.version }}-win-x64/game.dll
          fail_on_unmatched_files: true
